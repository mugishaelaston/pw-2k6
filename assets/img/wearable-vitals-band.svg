<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="wb-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#06111d" />
    </linearGradient>
    <linearGradient id="wb-strap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16293d" />
      <stop offset="100%" stop-color="#0e1b29" />
    </linearGradient>
    <linearGradient id="wb-pod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3957" />
      <stop offset="100%" stop-color="#0f2236" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="320" height="220" rx="16" fill="url(#wb-bg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Vitals wave behind wearable -->
  <path d="M 20 110 L 80 110 L 95 90 L 105 130 L 115 75 L 125 125 L 135 105 L 145 110 L 180 110 L 195 95 L 205 130 L 215 80 L 225 120 L 235 110 L 300 110" 
        stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.35" fill="none" />

  <!-- Ergonomic Curved Strap -->
  <path d="M 60 145 C 80 85, 240 85, 260 145" stroke="url(#wb-strap)" stroke-width="26" stroke-linecap="round" fill="none" />
  <path d="M 60 145 C 80 85, 240 85, 260 145" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round" fill="none" />

  <!-- Optical Sensor Contact Array Dots on strap -->
  <circle cx="100" cy="118" r="3.5" fill="#34d399" opacity="0.8" />
  <circle cx="220" cy="118" r="3.5" fill="#34d399" opacity="0.8" />

  <!-- Central Sensor Pod / Life Suit Core Hub -->
  <rect x="125" y="80" width="70" height="48" rx="12" fill="url(#wb-pod)" stroke="#22d3ee" stroke-width="2" />
  <!-- Display screen inside pod -->
  <rect x="133" y="88" width="54" height="32" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />

  <!-- Miniature Heart Rate & SpO2 Display Graphic -->
  <path d="M 140 104 L 148 104 L 152 96 L 156 112 L 160 100 L 164 104 L 178 104" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="172" cy="95" r="2.5" fill="#22d3ee" />

  <!-- Optical Vitals Sensor Emitting Glow downward -->
  <ellipse cx="160" cy="155" rx="35" ry="12" fill="#22d3ee" opacity="0.12" />
  <circle cx="160" cy="138" r="4" fill="#34d399" />
  <circle cx="160" cy="138" r="9" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.2" fill="none" />

  <!-- Label Badge -->
  <rect x="16" y="16" width="144" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#22d3ee" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">LIFE SUIT WEARABLE</text>
</svg>
