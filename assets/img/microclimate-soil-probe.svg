<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="sp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#06111d" />
    </linearGradient>
    <linearGradient id="sp-rod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#sp-bg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Soil Stratum Horizon -->
  <line x1="20" y1="90" x2="300" y2="90" stroke="#334155" stroke-width="2" />
  <rect x="20" y="90" width="280" height="110" rx="4" fill="#091826" opacity="0.7" />

  <!-- Soil Stratum layers -->
  <line x1="20" y1="125" x2="300" y2="125" stroke="#1e3a5a" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="20" y1="160" x2="300" y2="160" stroke="#1e3a5a" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Soil Depth Markers -->
  <text x="35" y="112" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">-10 cm (Topsoil)</text>
  <text x="35" y="147" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">-25 cm (Root Zone)</text>
  <text x="35" y="182" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">-45 cm (Subsoil)</text>

  <!-- Central Multi-Depth Probe -->
  <rect x="185" y="45" width="18" height="40" rx="4" fill="#132a42" stroke="#22d3ee" stroke-width="1.5" />
  <circle cx="194" cy="58" r="3" fill="#34d399" />

  <!-- Penetration Shaft -->
  <rect x="191" y="85" width="6" height="105" rx="3" fill="url(#sp-rod)" />

  <!-- Sensor Ring Bands on shaft -->
  <rect x="188" y="110" width="12" height="6" rx="2" fill="#22d3ee" stroke="#081827" stroke-width="1" />
  <rect x="188" y="145" width="12" height="6" rx="2" fill="#34d399" stroke="#081827" stroke-width="1" />
  <rect x="188" y="175" width="12" height="6" rx="2" fill="#38bdf8" stroke="#081827" stroke-width="1" />

  <!-- Telemetry Data Pulse Callouts -->
  <path d="M 200 113 L 235 113" stroke="#22d3ee" stroke-width="1.5" />
  <text x="240" y="116" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="10">pH 6.4 · NPK</text>

  <path d="M 200 148 L 235 148" stroke="#34d399" stroke-width="1.5" />
  <text x="240" y="151" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Moist: 68%</text>

  <path d="M 200 178 L 235 178" stroke="#38bdf8" stroke-width="1.5" />
  <text x="240" y="181" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Temp: 21.2°C</text>

  <!-- Wireless Link Arcs at Head -->
  <path d="M 208 48 A 10 10 0 0 1 208 62" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Label Badge -->
  <rect x="16" y="16" width="148" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#22d3ee" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">MULTI-DEPTH SOIL PROBE</text>
</svg>
