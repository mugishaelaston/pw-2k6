<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#06111d" />
    </linearGradient>
    <linearGradient id="ch-bldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14283c" />
      <stop offset="100%" stop-color="#0c1824" />
    </linearGradient>
    <linearGradient id="ch-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3e5c" />
      <stop offset="100%" stop-color="#12273a" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="320" height="220" rx="16" fill="url(#ch-bg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Background hills -->
  <path d="M 0 130 Q 90 100, 180 125 T 320 110 L 320 220 L 0 220 Z" fill="#0c1d2e" opacity="0.6" />
  <line x1="20" y1="185" x2="300" y2="185" stroke="#1e3a5a" stroke-width="2" />

  <!-- Telemetry Mast on clinic roof -->
  <line x1="210" y1="50" x2="210" y2="110" stroke="#94a3b8" stroke-width="2" />
  <circle cx="210" cy="46" r="3.5" fill="#34d399" />
  <!-- Signal Transmission Arcs -->
  <path d="M 220 42 A 12 12 0 0 1 220 54" stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.8" />
  <path d="M 227 36 A 20 20 0 0 1 227 60" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="3 3" fill="none" opacity="0.6" />

  <!-- Clinic Building -->
  <!-- Pitched Roof -->
  <polygon points="160,75 75,115 245,115" fill="url(#ch-roof)" stroke="#22d3ee" stroke-width="1.5" />

  <!-- Main Walls -->
  <rect x="90" y="115" width="140" height="70" fill="url(#ch-bldg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Medical Cross Sentinel Emblem -->
  <circle cx="160" cy="138" r="14" fill="#081420" stroke="#34d399" stroke-width="1.5" />
  <rect x="157" y="129" width="6" height="18" rx="1" fill="#34d399" />
  <rect x="151" y="135" width="18" height="6" rx="1" fill="#34d399" />

  <!-- Clinic Door & Windows -->
  <rect x="146" y="157" width="28" height="28" rx="2" fill="#07121d" stroke="#22d3ee" stroke-width="1" />
  <rect x="105" y="135" width="24" height="20" rx="3" fill="#0d2238" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
  <line x1="117" y1="135" x2="117" y2="155" stroke="#1f3b56" stroke-width="1" />
  <rect x="191" y="135" width="24" height="20" rx="3" fill="#0d2238" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
  <line x1="203" y1="135" x2="203" y2="155" stroke="#1f3b56" stroke-width="1" />

  <!-- Solar Panel on Clinic Roof -->
  <polygon points="100,105 135,90 145,108 110,113" fill="#0d2238" stroke="#34d399" stroke-width="1" />

  <!-- Clinician Connectivity Node -->
  <circle cx="265" cy="165" r="4" fill="#22d3ee" />
  <line x1="230" y1="165" x2="260" y2="165" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Label Badge -->
  <rect x="16" y="16" width="144" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">HEALTH POST TELEMETRY</text>
</svg>
