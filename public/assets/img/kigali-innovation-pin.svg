<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="kp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#06111d" />
    </linearGradient>
    <linearGradient id="kp-pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#kp-bg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Topographic Contour Rings of Kigali Hills -->
  <path d="M 60 160 C 90 130, 230 130, 260 160 C 240 185, 80 185, 60 160 Z" stroke="#1f3b56" stroke-width="1.5" fill="none" opacity="0.6" />
  <path d="M 80 155 C 105 135, 215 135, 240 155 C 220 175, 100 175, 80 155 Z" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.3" fill="none" stroke-dasharray="3 3" />
  <path d="M 110 150 C 125 140, 195 140, 210 150 C 195 165, 125 165, 110 150 Z" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" fill="none" />

  <!-- Radar targeting coordinate crosshairs -->
  <line x1="160" y1="50" x2="160" y2="185" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="60" y1="145" x2="260" y2="145" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Ripple pulse circles on Kigali location -->
  <ellipse cx="160" cy="145" rx="35" ry="14" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5" fill="none" />
  <ellipse cx="160" cy="145" rx="55" ry="22" stroke="#34d399" stroke-opacity="0.2" stroke-width="1" fill="none" />

  <!-- Kigali Sentinel Beacon Pin -->
  <g transform="translate(136, 60)">
    <!-- Hexagonal Pin Head matching Xanichi Sentinel -->
    <polygon points="24,6 42,16 42,38 24,48 6,38 6,16" fill="#0c2033" stroke="url(#kp-pin)" stroke-width="2.5" />
    <circle cx="24" cy="27" r="7" fill="#34d399" />
    <circle cx="24" cy="27" r="3" fill="#ffffff" />
    <!-- Pin stem pointing down -->
    <path d="M 24 48 L 24 85" stroke="url(#kp-pin)" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Ground contact point -->
  <circle cx="160" cy="145" r="4.5" fill="#34d399" />

  <!-- Coordinate Readout -->
  <text x="160" y="198" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.08em">1.9441° S, 30.0619° E</text>

  <!-- Label Badge -->
  <rect x="16" y="16" width="134" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">KIGALI, RWANDA HQ</text>
</svg>
