<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#06111d" />
    </linearGradient>
    <linearGradient id="sm-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="320" height="220" rx="16" fill="url(#sm-bg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Constellation Network Edges -->
  <line x1="60" y1="90" x2="130" y2="60" stroke="url(#sm-line)" stroke-width="2" stroke-dasharray="4 2" opacity="0.6" />
  <line x1="130" y1="60" x2="220" y2="80" stroke="url(#sm-line)" stroke-width="2" opacity="0.7" />
  <line x1="220" y1="80" x2="260" y2="140" stroke="url(#sm-line)" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="60" y1="90" x2="100" y2="160" stroke="url(#sm-line)" stroke-width="2" opacity="0.65" />
  <line x1="100" y1="160" x2="180" y2="145" stroke="url(#sm-line)" stroke-width="2" opacity="0.8" />
  <line x1="180" y1="145" x2="220" y2="80" stroke="url(#sm-line)" stroke-width="2" opacity="0.7" />
  <line x1="130" y1="60" x2="180" y2="145" stroke="url(#sm-line)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4" />
  <line x1="180" y1="145" x2="260" y2="140" stroke="url(#sm-line)" stroke-width="2" opacity="0.75" />

  <!-- Concentric Signal Wavefronts from Center Node -->
  <circle cx="180" cy="145" r="28" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.3" fill="none" />
  <circle cx="180" cy="145" r="50" stroke="#34d399" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="5 4" fill="none" />
  <circle cx="180" cy="145" r="75" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.12" fill="none" />

  <!-- Network Nodes with Glow -->
  <!-- Node 1: Left Sensor -->
  <circle cx="60" cy="90" r="7" fill="#081827" stroke="#34d399" stroke-width="2.5" />
  <circle cx="60" cy="90" r="3" fill="#34d399" />

  <!-- Node 2: Top Climate Node -->
  <circle cx="130" cy="60" r="8" fill="#081827" stroke="#22d3ee" stroke-width="2.5" />
  <circle cx="130" cy="60" r="3.5" fill="#22d3ee" />

  <!-- Node 3: Farm Plot Gateway -->
  <circle cx="220" cy="80" r="9" fill="#081827" stroke="#34d399" stroke-width="2.5" />
  <circle cx="220" cy="80" r="4" fill="#34d399" />

  <!-- Node 4: Hub Center -->
  <circle cx="180" cy="145" r="12" fill="#081827" stroke="url(#sm-line)" stroke-width="3" />
  <circle cx="180" cy="145" r="5" fill="#22d3ee" />

  <!-- Node 5: Soil Sensor -->
  <circle cx="100" cy="160" r="6" fill="#081827" stroke="#38bdf8" stroke-width="2" />
  <circle cx="100" cy="160" r="2.5" fill="#38bdf8" />

  <!-- Node 6: Health Clinic Terminal -->
  <circle cx="260" cy="140" r="8" fill="#081827" stroke="#34d399" stroke-width="2.5" />
  <circle cx="260" cy="140" r="3.5" fill="#34d399" />

  <!-- Label Badge -->
  <rect x="16" y="16" width="138" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#22d3ee" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">EDGE DATA MESH WAVE</text>
</svg>
