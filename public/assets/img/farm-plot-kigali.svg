<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="fp-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#07121e" />
    </linearGradient>
    <linearGradient id="fp-hill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2f38" />
      <stop offset="100%" stop-color="#0b242e" />
    </linearGradient>
    <linearGradient id="fp-hill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#083832" />
      <stop offset="100%" stop-color="#0a2a2c" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="320" height="220" rx="16" fill="url(#fp-sky)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Kigali Distant Rolling Ridges -->
  <path d="M 0 110 Q 70 85, 140 105 T 320 90 L 320 220 L 0 220 Z" fill="#0c1d2e" opacity="0.6" />
  <path d="M 0 135 Q 90 115, 180 130 T 320 120 L 320 220 L 0 220 Z" fill="url(#fp-hill1)" />

  <!-- Agricultural Terraces -->
  <path d="M 0 160 C 80 150, 160 170, 320 150 L 320 220 L 0 220 Z" fill="url(#fp-hill2)" />
  <path d="M 0 185 C 100 178, 200 192, 320 175 L 320 220 L 0 220 Z" fill="#062220" />

  <!-- Terraced Crop Rows -->
  <g stroke="#34d399" stroke-width="1.5" opacity="0.75" stroke-linecap="round">
    <!-- Row 1 Sprouting Plants -->
    <path d="M 30 175 Q 32 168 35 166 M 35 166 Q 38 168 40 175" />
    <path d="M 60 174 Q 62 167 65 165 M 65 165 Q 68 167 70 174" />
    <path d="M 90 175 Q 92 168 95 166 M 95 166 Q 98 168 100 175" />
    <path d="M 120 177 Q 122 170 125 168 M 125 168 Q 128 170 130 177" />
    <path d="M 150 178 Q 152 171 155 169 M 155 169 Q 158 171 160 178" />
    <path d="M 180 176 Q 182 169 185 167 M 185 167 Q 188 169 190 176" />
    <path d="M 210 174 Q 212 167 215 165 M 215 165 Q 218 167 220 174" />
    <path d="M 240 172 Q 242 165 245 163 M 245 163 Q 248 165 250 172" />
    <path d="M 270 170 Q 272 163 275 161 M 275 161 Q 278 163 280 170" />
  </g>

  <!-- Microclimate Data Overlay Grid -->
  <g stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 3" opacity="0.45">
    <line x1="80" y1="60" x2="80" y2="160" />
    <line x1="160" y1="50" x2="160" y2="170" />
    <line x1="240" y1="55" x2="240" y2="165" />
    <line x1="40" y1="120" x2="280" y2="120" />
  </g>

  <!-- Telemetry Data Nodes -->
  <circle cx="80" cy="120" r="4" fill="#22d3ee" />
  <circle cx="160" cy="100" r="5" fill="#34d399" />
  <circle cx="240" cy="115" r="4" fill="#22d3ee" />

  <!-- Label Badge -->
  <rect x="16" y="16" width="136" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#22d3ee" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">KIGALI PLOT TELEMETRY</text>
</svg>
