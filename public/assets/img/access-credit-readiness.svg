<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="ac-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#06111d" />
    </linearGradient>
    <linearGradient id="ac-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ac-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14283e" />
      <stop offset="100%" stop-color="#0c1b2c" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="320" height="220" rx="16" fill="url(#ac-bg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Radar Credit Readiness concentric grid -->
  <circle cx="160" cy="115" r="70" stroke="#1f3b56" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  <circle cx="160" cy="115" r="48" stroke="#1f3b56" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  <circle cx="160" cy="115" r="26" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.2" fill="none" />

  <!-- Radar Axes -->
  <line x1="160" y1="45" x2="160" y2="185" stroke="#1f3b56" stroke-width="1" />
  <line x1="90" y1="115" x2="230" y2="115" stroke="#1f3b56" stroke-width="1" />
  <line x1="110" y1="65" x2="210" y2="165" stroke="#1f3b56" stroke-width="0.8" stroke-dasharray="2 3" />
  <line x1="210" y1="65" x2="110" y2="165" stroke="#1f3b56" stroke-width="0.8" stroke-dasharray="2 3" />

  <!-- Explainable Readiness Polygon (Financial Profile) -->
  <polygon points="160,60 205,95 195,150 135,145 118,100" 
           fill="rgba(52, 211, 153, 0.18)" 
           stroke="url(#ac-grad)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Assessment Data Points -->
  <circle cx="160" cy="60" r="4.5" fill="#34d399" />
  <circle cx="205" cy="95" r="4.5" fill="#22d3ee" />
  <circle cx="195" cy="150" r="4.5" fill="#38bdf8" />
  <circle cx="135" cy="145" r="4.5" fill="#34d399" />
  <circle cx="118" cy="100" r="4.5" fill="#22d3ee" />

  <!-- Metric Callout Chips -->
  <rect x="20" y="70" width="82" height="24" rx="5" fill="url(#ac-card)" stroke="#22d3ee" stroke-width="1" />
  <text x="61" y="86" text-anchor="middle" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">PROFILE 88%</text>

  <rect x="218" y="140" width="86" height="24" rx="5" fill="url(#ac-card)" stroke="#34d399" stroke-width="1" />
  <text x="261" y="156" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">CAPITAL READY</text>

  <rect x="222" y="65" width="76" height="22" rx="5" fill="#091827" stroke="#1e3a5a" stroke-width="1" />
  <text x="260" y="80" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DOCUMENTATION</text>

  <!-- Central Sentinel Lens Ring -->
  <circle cx="160" cy="115" r="8" fill="#060b11" stroke="#ffffff" stroke-width="2" />
  <circle cx="160" cy="115" r="3" fill="#34d399" />

  <!-- Bottom Pathway Indicator -->
  <path d="M 100 195 L 160 185 L 220 195" stroke="url(#ac-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Label Badge -->
  <rect x="16" y="16" width="144" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">ACCESS CREDIT RADAR</text>
</svg>
