<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="gb-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b" />
      <stop offset="100%" stop-color="#06111d" />
    </linearGradient>
    <linearGradient id="gb-bag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a221b" />
      <stop offset="100%" stop-color="#191410" />
    </linearGradient>
    <linearGradient id="gb-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="320" height="220" rx="16" fill="url(#gb-bg)" stroke="#1e3a5a" stroke-width="1.5" />

  <!-- Ground surface -->
  <line x1="40" y1="185" x2="280" y2="185" stroke="#1e3a5a" stroke-width="2" stroke-linecap="round" />

  <!-- Biodegradable Growing Bag Body -->
  <path d="M 105 115 L 215 115 L 205 185 L 115 185 Z" fill="url(#gb-bag)" stroke="#4a3b2c" stroke-width="2" rx="4" />
  <!-- Folded Rim -->
  <ellipse cx="160" cy="115" rx="55" ry="10" fill="#3a2f24" stroke="#5c4a37" stroke-width="1.5" />

  <!-- Enriched Organic Media Texture -->
  <ellipse cx="160" cy="115" rx="50" ry="7" fill="#241b14" />
  <circle cx="145" cy="116" r="2" fill="#4ade80" opacity="0.6" />
  <circle cx="170" cy="114" r="2.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="155" cy="117" r="1.5" fill="#facc15" opacity="0.7" />

  <!-- Biodegradable stitch lines -->
  <path d="M 120 130 C 130 150, 130 170, 128 180" stroke="#78593d" stroke-width="1" stroke-dasharray="3 3" />
  <path d="M 200 130 C 190 150, 190 170, 192 180" stroke="#78593d" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Thriving Seedling Stem -->
  <path d="M 160 114 Q 160 85, 158 60" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Left Leaf -->
  <path d="M 158 80 C 135 75, 125 55, 140 50 C 152 60, 158 70, 158 80 Z" fill="url(#gb-leaf)" stroke="#059669" stroke-width="1" />
  <path d="M 158 80 Q 148 65, 138 52" stroke="#a7f3d0" stroke-width="1" fill="none" />

  <!-- Right Leaf -->
  <path d="M 158 65 C 180 58, 195 40, 180 32 C 168 42, 160 55, 158 65 Z" fill="url(#gb-leaf)" stroke="#059669" stroke-width="1" />
  <path d="M 158 65 Q 170 50, 182 35" stroke="#a7f3d0" stroke-width="1" fill="none" />

  <!-- IoT Soil Composition Smart Sensor inserted in bag -->
  <path d="M 195 95 L 195 150" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
  <rect x="189" y="85" width="12" height="15" rx="3" fill="#0f2942" stroke="#22d3ee" stroke-width="1.5" />
  <circle cx="195" cy="92" r="2" fill="#34d399" />
  <!-- Wireless signal ripple from sensor -->
  <path d="M 208 85 A 8 8 0 0 1 208 97" stroke="#22d3ee" stroke-width="1.5" fill="none" />

  <!-- Label Badge -->
  <rect x="16" y="16" width="132" height="24" rx="6" fill="#081420" stroke="#1f3b56" stroke-width="1" />
  <text x="24" y="32" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">MY FARM BIO-MEDIA</text>
</svg>
